name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The committed deck bundle is checked byte for byte, so build it with the
  # same Bun release every time. Bump this together with a rebuilt bundle.
  BUN_VERSION: 1.3.9
  WRANGLER_SEND_METRICS: "false"

jobs:
  test:
    name: Type check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  bundle:
    name: Committed deck bundle is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:deck
      - name: Check _extensions/live-questions/live-questions.js
        run: |
          if ! git diff --exit-code -- _extensions/live-questions/live-questions.js; then
            echo "::error file=_extensions/live-questions/live-questions.js::The committed bundle is out of date. Run 'bun run build:deck' and commit the result."
            exit 1
          fi

  smoke-node:
    name: Node server smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Start the server
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          PRESENTER_KEY=ci-key DATA_DIR="$RUNNER_TEMP/data" PORT=8787 \
            nohup node dist/server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8787/healthz && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - run: bun scripts/smoke.ts http://localhost:8787 ci-key
      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/server.log"

  worker:
    name: Cloudflare Worker bundles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Wrangler runs on Node and needs Node 22 or later.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Bundles the Worker and the assets without deploying; needs no
      # Cloudflare credentials.
      - run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
      - run: ls -l "$RUNNER_TEMP/worker"

  render:
    name: Render example.qmd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: quarto --version
      - run: quarto render example.qmd
      - name: Check the filter ran
        run: |
          grep -q 'id="lq-config"' example.html
          grep -q 'class="lq-question lq-poll"' example.html
          grep -q 'class="lq-question lq-wordcloud"' example.html

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: quarto-revealjs-live-questions:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Start the container
        run: |
          docker run -d --name live-questions -p 8787:8787 -e PRESENTER_KEY=ci-key quarto-revealjs-live-questions:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8787/healthz && exit 0
            sleep 1
          done
          docker logs live-questions
          exit 1
      # smoke.ts imports only src/shared/protocol.ts, so no bun install.
      - run: bun scripts/smoke.ts http://localhost:8787 ci-key
      - name: Container log
        if: always()
        run: docker logs live-questions || true
